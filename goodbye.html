<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Until next time...👋</title>

  <style id="card-styles">
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f3e9e2;
      color: #38283a;
      font: 1rem system-ui, sans-serif;
    }

    main {
      width: min(92vw, 36rem);
      margin: 0 auto;
      padding: 2rem 0;
      text-align: center;
    }

    #card { touch-action: pan-y; }

    .face {
      padding: clamp(1rem, 5vw, 2rem);
      border-radius: 1.25rem;
      box-shadow: 0 .65rem 2rem #38283a20;
    }

    .cover { background: #fff8ef; }

    h1 {
      margin: 0 0 1.25rem;
      font: italic clamp(2.2rem, 8vw, 4rem) / 1.05 Georgia, serif;
    }

    .photo-frame {
      display: grid;
      align-items: center;
      overflow: hidden;
      min-height: 12rem;
      border-radius: .75rem;
      background: #e7c2b2;
    }

    .photo-frame img,
    .photo-frame svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .photo-frame img {
      max-height: 28rem;
      object-fit: contain;
    }

    .cover-caption {
      margin: 1.2rem 0 0;
      font: italic 1.2rem Georgia, serif;
    }

    .note { background: #38283a; padding: .65rem; }

    .paper {
      display: block;
      width: 100%;
      min-height: 19rem;
      margin: 0;
      padding: 0 1rem 1rem;
      border: 0;
      border-radius: .75rem;
      background: repeating-linear-gradient(
        #fff2c6 0 31px,
        #d8c69c 31px 32px
      );
      color: #263a59;
      font: 1.125rem / 32px Georgia, serif;
      text-align: left;
      overflow-wrap: anywhere;
    }

    textarea.paper {
      resize: vertical;
      background-attachment: local;
    }

    #saved-message { white-space: pre-wrap; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: .75rem;
      margin-top: 1rem;
    }

    button {
      border: 0;
      border-radius: 2rem;
      padding: .65rem 1rem;
      background: #553950;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    button:disabled { opacity: .55; cursor: default; }
    :focus-visible { outline: 3px solid #986438; outline-offset: 3px; }
    #hint { margin: .75rem 0 0; color: #655566; }
    #status:empty { display: none; }
    footer { margin-top: 1.5rem; font-size: .85rem; color: #655566; }
  </style>
</head>
<body>
<main>
  <div id="card">
    <section class="face cover" id="cover">
      <h1>Until next time...👋</h1>

      <div class="photo-frame">
        <svg id="placeholder" viewBox="0 0 640 400"
             role="img" aria-label="Placeholder illustration of mountains at sunset">
          <rect width="640" height="400" fill="#e7b3a2"/>
          <circle cx="425" cy="135" r="59" fill="#ffdda7"/>
          <path d="M0 298 150 144 281 280 397 211 640 350V400H0Z" fill="#9d6877"/>
          <path d="M0 350 146 255 263 320 388 251 640 360V400H0Z" fill="#5e465e"/>
        </svg>
        <img id="cover-photo" alt="A photo from the sender" hidden>
      </div>

      <p class="cover-caption">Thank you for the memories</p>
    </section>

    <section class="face note" id="note" aria-label="Personal note" hidden>
      <textarea id="message" class="paper" rows="9"
                aria-label="Your card message">Hey, my friend,


Until next time ♡</textarea>

      <div class="paper" id="saved-message" hidden></div>
    </section>
  </div>

  <div class="controls">
    <button type="button" id="turn" aria-controls="note"
            aria-expanded="false">Write note</button>

    <label id="photo-control">
      Cover photo
      <input type="file" id="photo-input" accept="image/jpeg,image/png,image/webp">
    </label>

    <button type="button" id="download">Download card</button>
  </div>

  <p id="hint">Open the card to edit your note.</p>
  <p id="status" role="status"></p>
  <footer>G4RG Creations 🖤</footer>
</main>

<script>
  // Used by both the editor and the downloaded card.
  function setupCard(editing) {
    const card = document.querySelector('#card');
    const cover = document.querySelector('#cover');
    const note = document.querySelector('#note');
    const turn = document.querySelector('#turn');
    const hint = document.querySelector('#hint');
    let gesture = null;

    function showNote(open) {
      cover.hidden = open;
      note.hidden = !open;
      turn.setAttribute('aria-expanded', String(open));

      turn.textContent = open
        ? 'Back to cover'
        : editing ? 'Write note' : 'Open card';

      hint.textContent = editing
        ? (open ? 'Type directly on the lined paper.' : 'Open the card to edit your note.')
        : '';
    }

    turn.addEventListener('click', () => showNote(note.hidden));

    // The editor leaves gestures on the paper available for selecting text.
    if (!editing) {
      card.addEventListener('pointerdown', event => {
        if (!event.isPrimary || event.button !== 0) return;
        gesture = { id: event.pointerId, x: event.clientX, y: event.clientY };
        card.setPointerCapture(event.pointerId);
      });

      card.addEventListener('pointercancel', () => { gesture = null; });

      card.addEventListener('pointerup', event => {
        if (gesture?.id !== event.pointerId) return;
        const dx = event.clientX - gesture.x;
        const dy = event.clientY - gesture.y;
        gesture = null;

        if (Math.abs(dx) >= 48 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          showNote(dx > 0);
        }
      });
    }

    showNote(false);
  }

  setupCard(true);

  const message = document.querySelector('#message');
  const photoInput = document.querySelector('#photo-input');
  const photo = document.querySelector('#cover-photo');
  const placeholder = document.querySelector('#placeholder');
  const download = document.querySelector('#download');
  const status = document.querySelector('#status');
  let photoLoading = false;
  let photoSelection = 0;

  function updateDownloadButton() {
    download.disabled = photoLoading || !message.value.trim();
  }

  photoInput.addEventListener('change', async () => {
    const file = photoInput.files[0];
    if (!file) return;

    const selection = ++photoSelection;
    photoLoading = true;
    status.textContent = 'Loading photo…';
    updateDownloadButton();

    try {
      const dataURL = await embedPhoto(file);
      if (selection !== photoSelection) return;

      photo.src = dataURL;
      photo.hidden = false;
     placeholder.setAttribute('hidden', '');
      status.textContent = 'Cover photo added.';
    } catch {
      if (selection !== photoSelection) return;
      status.textContent = 'Could not open that photo. Try a JPG, PNG, or WebP.';
    } finally {
      if (selection === photoSelection) {
        photoLoading = false;
        updateDownloadButton();
      }
    }
  });

  async function embedPhoto(file) {
    const objectURL = URL.createObjectURL(file);

    try {
      const image = new Image();
      image.src = objectURL;
      await image.decode();

      // Keep the attachment small enough to send alongside the note.
      const scale = Math.min(1, 1600 / Math.max(image.naturalWidth, image.naturalHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));

      const context = canvas.getContext('2d');
      context.fillStyle = '#fff8ef';
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.drawImage(image, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', 0.87);
    } finally {
      URL.revokeObjectURL(objectURL);
    }
  }

  message.addEventListener('input', updateDownloadButton);

  download.addEventListener('click', () => {
    if (photoLoading || !message.value.trim()) return;

    const cardCopy = document.querySelector('main').cloneNode(true);

    // Insert the note as plain text and leave the editor controls out of the file.
    cardCopy.querySelector('#saved-message').textContent = message.value;
    cardCopy.querySelector('#saved-message').hidden = false;
    cardCopy.querySelector('#cover').hidden = false;
    cardCopy.querySelector('#note').hidden = true;

    const turn = cardCopy.querySelector('#turn');
    turn.textContent = 'Open card';
    turn.setAttribute('aria-expanded', 'false');
    cardCopy.querySelector('#hint').hidden = true;

    for (const selector of ['#message', '#photo-control', '#download', '#status']) {
      cardCopy.querySelector(selector).remove();
    }

    const exported = document.implementation.createHTMLDocument('Until next time...👋');
    exported.documentElement.lang = 'en';
    exported.head.prepend(document.querySelector('meta[charset]').cloneNode(true));
    exported.head.append(
      document.querySelector('meta[name="viewport"]').cloneNode(true),
      document.querySelector('#card-styles').cloneNode(true)
    );
    exported.body.append(cardCopy);

    const script = exported.createElement('script');
    script.textContent = `(${setupCard.toString()})(false);`;
    exported.body.append(script);

    const file = new Blob(
      ['<!doctype html>\n', exported.documentElement.outerHTML],
      { type: 'text/html;charset=utf-8' }
    );

    const fileURL = URL.createObjectURL(file);
    const link = document.createElement('a');
    link.href = fileURL;
    link.download = 'goodbye-card.html';
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(fileURL), 30000);

    status.textContent = 'Card downloaded. Send goodbye-card.html to your friend.';
  });

  updateDownloadButton();
</script>
</body>
</html>
