<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Little Cards</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #f5eadf;
      color: #382638;
      font: 1rem system-ui, sans-serif;
    }

    main { width: min(92vw, 36rem); padding: 1.5rem 0; text-align: center; }
    .surface { touch-action: pan-y; }

    .cover {
      display: grid;
      align-content: center;
      min-height: clamp(18rem, 55vh, 28rem);
      padding: 2rem;
      border-radius: 1.4rem;
      color: #fff0dd;
    /*  background:
        radial-gradient(circle at 50% 83%, #ffc49b 0 3rem, transparent 3.05rem),
        linear-gradient(155deg, #36243f 10%, #70435e 58%, #cf806d);*/
       background: url("image.jpeg") center / cover no-repeat;
      box-shadow: 0 1rem 2.5rem #38263826;
    }

    h1 { margin: 0; font: italic clamp(2.8rem, 9vw, 5rem)/1 Georgia, serif; }
    .cover p { margin: 0 0 1rem; }

    .tablet { padding: .65rem; border-radius: 1.3rem; background: #272333; }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: .75rem;
      background: repeating-linear-gradient(
        #fff8e8 0 27px, #ded9ce 27px 28px
      );
    }

    canvas.writing { touch-action: none; cursor: crosshair; }
    .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; }
    button { padding: .65rem .9rem; border: 0; border-radius: 2rem;
      background: #563752; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    :focus-visible { outline: 3px solid #956340; outline-offset: 3px; }
    #hint { margin: 1rem 0 .7rem; }
    #status:empty { display: none; }
    #share-url { width: 100%; padding: .6rem; margin-top: .5rem; font: inherit; }
    footer { margin-top: 1.5rem; font-size: .85rem; }
    footer a { color: inherit; }

    #note{
      color: white;
      font-size: 1.5rem;
      color: black;
    }
  </style>
</head>
<body>
<main>
   <i><p id = "note">Until next time....👋</p></i>
  <div class="surface" id="surface">
    <section class="cover" id="cover">

     <!-- <h1>Until<br>Next Time.</h1> -->
    </section>

    <section class="tablet" id="tablet" aria-label="Handwritten note" hidden>
      <canvas id="paper" width="1000" height="1200">
        This browser cannot display the handwritten note.
      </canvas>
    </section>
  </div>

  <p id="hint"></p>
  <div class="controls">
    <button type="button" id="turn"></button>
    <button type="button" id="undo" hidden>Undo</button>
    <button type="button" id="share" hidden>Copy card link</button>
  </div>
  <input id="share-url" aria-label="Card link" readonly hidden>
  <p id="status" role="status"></p>

  <footer><a id="brand" href="./">G4RG Creations  🖤</a></footer>

</main>

<script>
  const PEN_SCALE = 4094;

  const surface = document.querySelector('#surface');
  const cover = document.querySelector('#cover');
  const tablet = document.querySelector('#tablet');
  const paper = document.querySelector('#paper');
  const turn = document.querySelector('#turn');
  const undo = document.querySelector('#undo');
  const share = document.querySelector('#share');
  const shareURL = document.querySelector('#share-url');
  const hint = document.querySelector('#hint');
  const status = document.querySelector('#status');
  const ink = paper.getContext('2d');

  const makerURL = new URL(location.href);
  makerURL.hash = '';
  document.querySelector('#brand').href = makerURL.href;

  const params = new URLSearchParams(location.hash.slice(1));
  const encodedNote = params.get('note');
  const viewing = encodedNote !== null;

  let strokes = [];
  let active = null;
  let gesture = null;
  let invalidNote = false;

  ink.strokeStyle = '#243d68';
  ink.fillStyle = '#243d68';
  ink.lineWidth = 4;
  ink.lineCap = 'round';
  ink.lineJoin = 'round';

  if (viewing) {
    try {
      strokes = decodeNote(encodedNote);
    } catch {
      invalidNote = true;
    }
  }

  function encodeNote() {
    const packed = strokes.map(stroke =>
      stroke.map(([x, y]) => String.fromCharCode(
        x >> 4,
        ((x & 15) << 4) | (y >> 8),
        y & 255
      )).join('')
    ).join('\xff\xff\xff');

    return 'v2.' + btoa(packed);
  }

  function decodeNote(encoded) {
    const precise = encoded.startsWith('v2.');
    const stride = precise ? 3 : 2;
    const sourceScale = precise ? PEN_SCALE : 250;
    const bytes = atob(precise ? encoded.slice(3) : encoded);

    if (!bytes.length || bytes.length % stride !== 0) {
      throw new Error('Invalid note');
    }

    const result = [];
    let stroke = [];

    for (let i = 0; i < bytes.length; i += stride) {
      const a = bytes.charCodeAt(i);
      const b = bytes.charCodeAt(i + 1);
      const c = precise ? bytes.charCodeAt(i + 2) : 255;

      if (a === 255 && b === 255 && c === 255) {
        if (!stroke.length) throw new Error('Invalid stroke');
        result.push(stroke);
        stroke = [];
        continue;
      }

      const x = precise ? (a << 4) | (b >> 4) : a;
      const y = precise ? ((b & 15) << 8) | c : b;
      if (x > sourceScale || y > sourceScale) throw new Error('Invalid point');

      stroke.push([
        Math.round(x * PEN_SCALE / sourceScale),
        Math.round(y * PEN_SCALE / sourceScale)
      ]);
    }

    if (!stroke.length) throw new Error('Invalid stroke');
    result.push(stroke);
    return result;
  }

  function canvasPoint([x, y]) {
    return [x * paper.width / PEN_SCALE, y * paper.height / PEN_SCALE];
  }

  function drawDot(point) {
    ink.beginPath();
    ink.arc(point[0], point[1], ink.lineWidth / 2, 0, Math.PI * 2);
    ink.fill();
  }

  function drawStroke(stroke) {
    const points = stroke.map(canvasPoint);
    if (points.length === 1) {
      drawDot(points[0]);
      return;
    }

    ink.beginPath();
    ink.moveTo(...points[0]);

    for (let i = 1; i < points.length - 1; i++) {
      const [x, y] = points[i];
      const [nextX, nextY] = points[i + 1];
      ink.quadraticCurveTo(x, y, (x + nextX) / 2, (y + nextY) / 2);
    }

    ink.lineTo(...points[points.length - 1]);
    ink.stroke();
  }

  function redraw() {
    ink.clearRect(0, 0, paper.width, paper.height);
    for (const stroke of strokes) drawStroke(stroke);
  }

  function updateButtons() {
    undo.disabled = share.disabled = active !== null || strokes.length === 0;
  }

  function clearShareResult() {
    shareURL.hidden = true;
    status.textContent = '';
  }

  function showNote(open) {
    cover.hidden = open;
    tablet.hidden = !open;
    turn.setAttribute('aria-expanded', String(open));
    turn.textContent = open ? 'Back to cover' : viewing ? 'Open card' : 'Write note';

    hint.textContent = viewing
      ? (open ? 'Swipe left to return' : 'Swipe right to open')
      : (open ? 'Write directly on the lined paper' : 'Open the card to write your note');

    undo.hidden = share.hidden = !open || viewing;
    clearShareResult();
    updateButtons();

    if (open) {
      redraw();
      if (invalidNote) status.textContent = 'This card link is incomplete or invalid.';
    }
  }

  function addPoint(event, bounds) {
    const quantize = value =>
      Math.round(Math.max(0, Math.min(1, value)) * PEN_SCALE);

    const point = [
      quantize((event.clientX - bounds.left) / bounds.width),
      quantize((event.clientY - bounds.top) / bounds.height)
    ];

    const points = active.points;
    const previous = points[points.length - 1];
    if (previous && previous[0] === point[0] && previous[1] === point[1]) return;

    points.push(point);
    const [x, y] = canvasPoint(point);

    // Show ink immediately. The finished stroke is redrawn as a smooth curve.
    if (previous) {
      ink.beginPath();
      ink.moveTo(...canvasPoint(previous));
      ink.lineTo(x, y);
      ink.stroke();
    } else {
      drawDot([x, y]);
    }
  }

  function finishStroke(event) {
    if (active?.id !== event.pointerId) return;
    if (event.type === 'pointerup') addPoint(event, paper.getBoundingClientRect());
    active = null;
    redraw();
    updateButtons();
  }

  turn.addEventListener('click', () => showNote(tablet.hidden));

  if (viewing) {
    surface.addEventListener('pointerdown', event => {
      if (!event.isPrimary || event.button !== 0) return;
      gesture = { id: event.pointerId, x: event.clientX, y: event.clientY };
      surface.setPointerCapture(event.pointerId);
    });

    surface.addEventListener('pointercancel', () => { gesture = null; });

    surface.addEventListener('pointerup', event => {
      if (gesture?.id !== event.pointerId) return;

      const dx = event.clientX - gesture.x;
      const dy = event.clientY - gesture.y;
      gesture = null;

      if (Math.abs(dx) >= 48 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        showNote(dx > 0);
      }
    });
  } else {
    paper.classList.add('writing');

    paper.addEventListener('pointerdown', event => {
      if (active || event.button !== 0) return;

      active = { id: event.pointerId, points: [] };
      strokes.push(active.points);
      paper.setPointerCapture(event.pointerId);
      addPoint(event, paper.getBoundingClientRect());
      clearShareResult();
      updateButtons();
    });

    paper.addEventListener('pointermove', event => {
      if (active?.id !== event.pointerId) return;

      const bounds = paper.getBoundingClientRect();
      const samples = event.getCoalescedEvents?.();
      for (const sample of samples?.length ? samples : [event]) {
        addPoint(sample, bounds);
      }
    });

    paper.addEventListener('pointerup', finishStroke);
    paper.addEventListener('pointercancel', finishStroke);
    paper.addEventListener('lostpointercapture', finishStroke);

    undo.addEventListener('click', () => {
      if (active) return;
      strokes.pop();
      redraw();
      clearShareResult();
      updateButtons();
    });

    share.addEventListener('click', async () => {
      if (active || !strokes.length) return;

      if (location.protocol === 'file:') {
        status.textContent = 'Open this page with Live Server or GitHub Pages to share it.';
        return;
      }

      const url = new URL(makerURL);
      url.hash = new URLSearchParams({ note: encodeNote() }).toString();
      shareURL.value = url.href;
      shareURL.hidden = false;

      try {
        await navigator.clipboard.writeText(url.href);
        status.textContent = 'Card link copied.';
      } catch {
        shareURL.focus();
        shareURL.select();
        status.textContent = 'Copy the card link from the field above.';
      }
    });
  }

  showNote(false);
</script>
</body>
</html>
